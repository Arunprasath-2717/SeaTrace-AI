<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <g transform="translate(4, 4)">
    <!-- 8-point nautical compass / helm in burnished gold -->
    <circle cx="20" cy="20" r="18" stroke="#C59B5F" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="20" cy="20" r="14" stroke="#C59B5F" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="3.5" fill="#C59B5F"/>
    
    <!-- 4 Cardinal Points -->
    <polygon points="20,4 22.5,16 20,13.5 17.5,16" fill="#C59B5F"/>
    <polygon points="20,36 22.5,24 20,26.5 17.5,24" fill="#A57D43"/>
    <polygon points="4,20 16,17.5 13.5,20 16,22.5" fill="#A57D43"/>
    <polygon points="36,20 24,17.5 26.5,20 24,22.5" fill="#C59B5F"/>
    
    <!-- 4 Ordinal Points -->
    <polygon points="9,9 18,17 16,16 17,14" fill="#DFBE88" opacity="0.8"/>
    <polygon points="31,9 23,17 24,16 26,17" fill="#DFBE88" opacity="0.8"/>
    <polygon points="9,31 17,23 16,24 14,23" fill="#DFBE88" opacity="0.8"/>
    <polygon points="31,31 23,23 24,24 23,26" fill="#DFBE88" opacity="0.8"/>
  </g>
  
  <!-- Wordmark -->
  <text x="56" y="25" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="600" letter-spacing="3" fill="#FFFFFF">AVENTIS</text>
  <text x="57" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="4.5" fill="#C59B5F">YACHT CHARTERS</text>
</svg>
