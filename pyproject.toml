[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m5-ais-intelligence"
version = "0.1.0"
description = "M5 AIS Intelligence Module for SeaTrace AI (Sagar Dhristi)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "fastapi>=0.90.0",
    "uvicorn>=0.20.0",
    "pydantic>=1.10.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "shapely>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: Live integration tests requiring a running PostGIS instance",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
